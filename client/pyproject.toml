[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2punch"
version = "0.2.0"
description = "Dependency-free Python STUN + UDP hole punching client for the p2punch rendezvous Worker"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
p2punch = "p2punch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
